<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beyond Breaking In</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="sketch-nav">
    <div class="nav-inner">
      <a href="./" class="nav-logo"><img src="./images/logo.png" alt="Maria Naggaga" class="nav-logo-img"> Beyond Breaking In</a>
      <div class="nav-links">
        <a href="./">Home</a>
        <a href="./about.html">About</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="hero">
      <div class="hero-text">
        <h1 class="sketch-title">Beyond Breaking In <span class="doodle">~</span></h1>
        <p class="hero-sub">Notes from the former me to the future you.</p>
      </div>
      <div class="hero-logo">
        <img src="./images/logo.png" alt="Beyond Breaking In" class="hero-logo-img">
      </div>
    </header>

    <section class="tags-filter" id="tags-filter" style="display:none;">
      <span class="filter-label">Filter:</span>
      <button class="tag-btn active" data-tag="all">All</button>
    </section>

    <section class="post-list" id="post-list">
      <p class="loading">Loading posts...</p>
    </section>
  </main>

  <footer class="sketch-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-brand">Beyond Breaking In</span>
        <span class="footer-tagline">Notes to the former me to the future you</span>
        <nav class="footer-links">
          <a href="./">Home</a>
          <a href="./about.html">About</a>
        </nav>
        <span class="footer-copy">🌸 My thoughts are like sprinkles! Colorful and a little messy! Feel free to skip.</span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
